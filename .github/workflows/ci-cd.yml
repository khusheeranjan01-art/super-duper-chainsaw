name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-validate:
    name: Code Quality & Dependency Check (CI)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r backend/requirements.txt

      - name: Lint Code with Flake8
        run: |
          flake8 backend --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Verify Core Imports
        run: |
          python -c "import fastapi, torch, faiss, transformers; print('Core ML and API dependencies successfully verified!')"

  docker-validation:
    name: Docker Configuration Validation (CD)
    needs: lint-and-validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Dockerfile & Structure
        run: |
          test -f Dockerfile && echo "Dockerfile present"
          test -f .dockerignore && echo ".dockerignore present"
          echo "Docker configuration validated successfully!"
